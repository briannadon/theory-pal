[project]
name = "tp-data"
version = "0.1.0"
description = "Offline corpus pipeline for theory-pal: emits public/model/transitions.json"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "torch>=2.13.0",
    "tqdm>=4.69.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_data"]
